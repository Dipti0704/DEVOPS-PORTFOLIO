name : CI Pipeline

on :
  push :
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read
  security-events: write 

jobs :
  ci :
    runs-on : ubuntu-latest

    defaults:
      run:
        working-directory: ./devops-portfolio-new

    steps :
      # 1 Checkout the source code 
      - name: Checkout code 
        uses: actions/checkout@v4

      # 2. Setup Node.js (for linting tools)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: devops-portfolio-new/package-lock.json

      # 3. Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 4 Linting  => for code quality
      - name: Run Linting
        run: npm run lint
        continue-on-error: true

      - name: Run Unit Tests
        run: npm test

      # 5. Initialize CodeQL (SAST)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          source-root: devops-portfolio-new

      # 6. Perform CodeQL Analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # 7. Trivy File System Scan
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'devops-portfolio-new'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # 8. Docker Build Image
      - name: Build Docker Image
        # Docker build context needs to be the specific folder since Dockerfile is there
        run: |
          docker build -t devops-portfolio:ci .

      # 9. Scan Docker Image (Container Security)
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-portfolio:ci
          severity: HIGH,CRITICAL
          exit-code: 1

      # 10. DockerHub Login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Tag & Push Trusted Image
      - name: Push Docker Image
        run: |
          docker tag devops-portfolio:ci ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio:latest

  